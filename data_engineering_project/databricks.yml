# This is a Declarative Automation Bundle definition for data_engineering_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: data_engineering_project
  uuid: 2d1a47de-d884-4e8b-b738-caf136534235

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/uat/prod targets below.
variables:
  catalog:
    description: The catalog to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-23ec29fd-2d98.cloud.databricks.com
    variables:
      catalog: dev_dep
    resources:
      jobs:
        master_job:
          name: "[dev_dep] master_job"

  uat:
    mode: production
    workspace:
      host: https://dbc-23ec29fd-2d98.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/agrawaldeepak386@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/agrawaldeepak386@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: uat_dep
    resources:
      jobs:
        master_job:
          name: "[uat_dep] master_job"
    permissions:
      - user_name: agrawaldeepak386@gmail.com
        level: CAN_MANAGE

  prod:
    mode: production
    workspace:
      host: https://dbc-23ec29fd-2d98.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/agrawaldeepak386@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/agrawaldeepak386@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: prod_dep
    resources:
      jobs:
        master_job:
          name: "[prod_dep] master_job"
    permissions:
      - user_name: agrawaldeepak386@gmail.com
        level: CAN_MANAGE